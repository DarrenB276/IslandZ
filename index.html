<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IslandZ — Survival</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧟</text></svg>">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- ============ SCREEN OVERLAYS ============ -->
<div id="vignette"></div>
<div id="blood-overlay"></div>
<div id="damage-flash"></div>
<div id="scope-overlay"><div class="scope-ring"></div><div class="scope-cross-h"></div><div class="scope-cross-v"></div></div>

<!-- ============ HUD ============ -->
<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>
  <div id="hitmarker">✕</div>

  <!-- top bar -->
  <div id="top-bar">
    <div id="status-icons"></div>
    <div class="top-right">
      <button class="hud-btn small" id="btn-swap" title="Swap weapon">
        <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3 1.5-1.5L21 9l-5.5 5.5L14 13l3-3H4V8zm16 8H7l3 3-1.5 1.5L3 15l5.5-5.5L10 11l-3 3h13v2z"/></svg>
      </button>
      <button class="hud-btn small" id="btn-inventory" title="Inventory">
        <svg viewBox="0 0 24 24"><path d="M17 6V5a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3v1H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3zM9 5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1H9V5z"/></svg>
      </button>
    </div>
  </div>

  <!-- interact prompt -->
  <button id="btn-interact"><span class="key">TAKE</span><span id="interact-label"></span></button>

  <!-- stamina bar -->
  <div id="stamina-wrap"><div id="stamina-bar"></div></div>

  <!-- stat icons column (DayZ style) -->
  <div id="stats-col">
    <div class="stat" id="stat-hp"><svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z"/></svg></div>
    <div class="stat" id="stat-blood"><svg viewBox="0 0 24 24"><path d="M12 2s7 8.1 7 13a7 7 0 0 1-14 0c0-4.9 7-13 7-13z"/></svg></div>
    <div class="stat" id="stat-food"><svg viewBox="0 0 24 24"><path d="M15.5 2c2.5 0 6.5 4 6.5 6.5 0 1.9-1.6 3.5-3.5 3.5-.9 0-1.8-.4-2.4-1L9.9 17.2a2.5 2.5 0 1 1-3.1-3.1L13 7.9c-.6-.6-1-1.5-1-2.4C12 3.6 13.6 2 15.5 2zM5 18a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg></div>
    <div class="stat" id="stat-water"><svg viewBox="0 0 24 24"><path d="M10 2h4v3h1v3.2c1.8 1 3 2.9 3 5V19a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-5.8c0-2.1 1.2-4 3-5V5h1V2zm-1 12h6v-1a3 3 0 0 0-1.8-2.7l-1.2-.6-1.2.6A3 3 0 0 0 9 13v1z"/></svg></div>
    <div class="stat" id="stat-temp"><svg viewBox="0 0 24 24"><path d="M13 3a2 2 0 0 0-4 0v9.4a4.5 4.5 0 1 0 4 0V3zm-2 16a2.5 2.5 0 0 1-1-4.8V5h2v9.2a2.5 2.5 0 0 1-1 4.8z"/></svg></div>
  </div>

  <!-- weapon info -->
  <div id="weapon-info">
    <div id="weapon-name">Fists</div>
    <div id="weapon-ammo"></div>
  </div>

  <!-- left controls -->
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <button class="hud-btn" id="btn-sprint">
    <svg viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.56-.89-1.68-1.25-2.65-.84L6 8.3V13h2V9.6l1.8-.7z"/></svg>
  </button>

  <!-- right controls -->
  <div id="right-controls">
    <button class="hud-btn" id="btn-reload">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <button class="hud-btn" id="btn-jump">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 7-1.4 1.4L13 6.8V21h-2V6.8l-4.6 4.6L5 10l7-7z"/></svg>
    </button>
    <button class="hud-btn" id="btn-aim">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.1a7 7 0 0 0-5.9-5.9V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2z"/></svg>
    </button>
    <button class="hud-btn big" id="btn-fire">
      <svg viewBox="0 0 24 24"><path d="M21 6H3v5h2v3h3l1 7h3l-1-7h1.5c.8 0 1.5-.7 1.5-1.5V11h7V6zM4.5 9.5v-2h1v2h-1z"/></svg>
    </button>
    <button class="hud-btn" id="btn-crouch">
      <svg viewBox="0 0 24 24"><path d="M12 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM8 10h8l2 4-1.7 1-1.4-2.7V16l2 5h-2.2l-1.9-4.6h-1.6L9.3 21H7l2.1-5v-3.7L7.7 15 6 14l2-4z"/></svg>
    </button>
    <button class="hud-btn" id="btn-prone">
      <svg viewBox="0 0 24 24"><path d="M4 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm4 2h7l3-3 2 1.4-3.6 3.6H8v-2zm9-6 3 1v3l-3-1v-3z"/></svg>
    </button>
  </div>
</div>

<!-- ============ INVENTORY ============ -->
<div id="inventory">
  <div id="inv-header">
    <span class="inv-title">INVENTORY</span>
    <button id="inv-close">✕</button>
  </div>
  <div id="inv-body">
    <div id="inv-equipment">
      <div class="inv-section-title">EQUIPMENT</div>
      <div id="equip-slots"></div>
    </div>
    <div id="inv-containers"></div>
    <div id="inv-vicinity">
      <div class="inv-section-title">VICINITY</div>
      <div id="vicinity-grid"></div>
    </div>
  </div>
  <div id="drag-ghost"></div>
  <button id="btn-rotate">⟳ ROTATE</button>
  <div id="action-sheet"></div>
</div>

<!-- ============ DEATH SCREEN ============ -->
<div id="death-screen">
  <div class="death-title">YOU ARE DEAD</div>
  <div class="death-sub" id="death-cause"></div>
  <button id="btn-respawn">RESPAWN</button>
</div>

<!-- ============ START SCREEN ============ -->
<div id="start-screen">
  <div class="start-inner">
    <h1>ISLAND<span>Z</span></h1>
    <p class="tagline">Low-poly survival. Stay fed. Stay quiet. Stay alive.</p>
    <button id="btn-start">DEPLOY</button>
    <p class="hint">Left side: move &nbsp;·&nbsp; Right side: look &nbsp;·&nbsp; Desktop: WASD + mouse</p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
